    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CGames - Productes</title>

<body>
    <header>
        <div class="logo">
            <a href="index.html">CGames</a>

        <section class="hero">
            <h1>Productes</h1>

        <section class="games-section">

                <select id="ordenar">
                    <option value="rating-desc">Puntuació: Major a menor</option>
                    <option value="rating-asc">Puntuació: Menor a major</option>
                    <option value="title-asc">Alfabètic: A - Z</option>

                    <option value="price-desc">Preu: Major a menor</option>
                    <option value="price-asc">Preu: Menor a major</option>
                </select>
                <div class="toggle-vista">
                    <button id="btn-graella" class="active">Graella</button>
                    <button id="btn-llistat">Llistat</button>
                </div>
            </div>

            <div id="games" class="vista-graella"></div>
